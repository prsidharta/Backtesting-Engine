[build-system]
requires = ["setuptools>=64", "wheel", "pybind11>=2.11", "cmake>=3.15"]
build-backend = "setuptools.build_meta"

[project]
name = "backtesting-rl"
version = "0.1.0"
description = "Python PPO workflow around a C++ trading simulation backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "torch>=2.2",
    "yfinance>=0.2",
    "ruff>=0.17.4",
]

[project.scripts]
backtest-rl = "train:main"

[tool.setuptools]
py-modules = ["backtest_gym", "train"]
package-dir = {"" = "python"}

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "setup.py" }, { file = "CMakeLists.txt" }, { file = "src/**/*.cpp" }, { file = "src/**/*.h" }]
