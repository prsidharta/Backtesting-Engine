name: Python RL
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Install Python project
        run: |
          if [ -f uv.lock ]; then
            uv sync --locked
          else
            uv sync
          fi
      - run: uv run --no-sync python -m unittest discover -s tests
